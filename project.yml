  SnaplistUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SnaplistUITests]
    dependencies:
      - target: Snaplist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rcabral.snaplist.uitests
        TEST_TARGET_NAME: Snaplist
        GENERATE_INFOPLIST_FILE: YES
