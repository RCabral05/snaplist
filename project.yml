# The Xcode project is generated from this file, never committed:
#   brew install xcodegen && xcodegen generate && open Snaplist.xcodeproj
name: Snaplist
options:
  bundleIdPrefix: com.rcabral
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  ArchiveCore:
    path: Packages/ArchiveCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Snaplist:
    type: application
    platform: iOS
    sources: [Snaplist]
    dependencies:
      - package: ArchiveCore
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rcabral.snaplist
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Snaplist/Info.plist
      properties:
        CFBundleDisplayName: Snaplist
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Snaplist uses the camera to scan receipts and documents into your archive.
