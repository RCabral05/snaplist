# The Xcode project is generated from this file, never committed:
#   brew install xcodegen && xcodegen generate && open Snaplist.xcodeproj
name: Snaplist
options:
  bundleIdPrefix: com.rcabral
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  ArchiveCore:
    path: Packages/ArchiveCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Above the 1.0.0 the Expo app used for this bundle ID, in case App Store
    # Connect already has builds under it.
    MARKETING_VERSION: "2.7.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Snaplist:
    type: application
    platform: iOS
    sources: [Snaplist, Shared]
    dependencies:
      - package: ArchiveCore
      # Widgets, the Control Center control and the share extension are off
      # until the App Group is registered on the developer site (README,
      # "Turning on widgets and sharing"). To turn them on, add back:
      #   - target: SnaplistWidgets
      #     embed: true
      #   - target: SnaplistShare
      #     embed: true
      # and the app's entitlements:
      #   entitlements:
      #     path: Snaplist/Snaplist.entitlements
      #     properties:
      #       com.apple.security.application-groups: [group.com.rcabral.snaplist]
    scheme:
      testTargets: [SnaplistUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rcabral.snaplist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The team comes from CI (APPLE_TEAM_ID) or Xcode's Signing tab.
        CODE_SIGN_STYLE: Automatic
    info:
      path: Snaplist/Info.plist
      properties:
        CFBundleDisplayName: Snaplist
        # Without these XcodeGen writes fixed values and the build settings
        # (and CI's build number) never reach the app.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Lists Snaplist in the share sheet for PDFs and images (Mail
        # attachments, Files, Safari). iOS hands over a copy to import.
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Image
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
          - CFBundleTypeName: Transactions
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.comma-separated-values-text]
        LSSupportsOpeningDocumentsInPlace: false
        # snaplist://scan and friends, opened by the widgets.
        CFBundleURLTypes:
          - CFBundleURLName: com.rcabral.snaplist
            CFBundleURLSchemes: [snaplist]
        NSCameraUsageDescription: Snaplist uses the camera to scan receipts and documents into your archive.
        NSFaceIDUsageDescription: Snaplist uses Face ID to keep your archive private.
        NSFinancialDataUsageDescription: Snaplist reads your Apple Card transactions on this iPhone to count your spending. They are never sent anywhere.
        NSMicrophoneUsageDescription: Snaplist records voice notes about where you put things.
        NSSpeechRecognitionUsageDescription: Snaplist turns your voice notes into text on this iPhone so you can search them.
