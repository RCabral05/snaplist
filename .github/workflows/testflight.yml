name: TestFlight

# Run by hand from the Actions tab (pick the branch), so every push does not
# become a TestFlight build.
on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY }}
      # Build numbers only have to increase within a version. Starting at
      # 1000 stays clear of anything EAS uploaded for this bundle ID.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        run: |
          missing=""
          [ -n "$KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_P8" ] || missing="$missing APP_STORE_CONNECT_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Use the newest installed release Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_[0-9]*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Write the App Store Connect key
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY_P8" > "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "BUILD=$((1000 + BUILD_NUMBER))" >> "$GITHUB_ENV"

      - run: brew install xcodegen
      - run: xcodegen generate

      # Automatic signing through the API key: Xcode creates or reuses the
      # distribution certificate and profile itself (cloud-managed signing).
      - name: Archive
        run: |
          xcodebuild archive \
            -project Snaplist.xcodeproj -scheme Snaplist -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Snaplist.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD" \
            | tee archive.log | grep -E "error:|warning:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Upload to TestFlight
        run: |
          cp ci/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert teamID -string "$TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Snaplist.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Uploaded build $BUILD. It appears in TestFlight once Apple finishes processing (usually 5-15 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f "$KEY_PATH"
